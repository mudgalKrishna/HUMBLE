[project]
name = "humble"
version = "0.3.0"
description = "Catch and repair bluffing in fine-tuned RAG models before deployment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pyyaml>=6.0",
  "huggingface_hub>=0.26",
  "auditkit==1.1.11",
  "curatorkit==0.1.27",
]

[project.optional-dependencies]
gpu = ["torch>=2.4", "transformers>=5.15", "peft>=0.18", "accelerate>=1.6", "aligntune==0.1.35", "pandas", "pyarrow", "pypdf"]
dev = ["pytest>=8"]

[project.scripts]
humble = "humble.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/humble"]

[tool.hatch.build.targets.wheel.force-include]
"configs/default.yaml" = "humble/default.yaml"
