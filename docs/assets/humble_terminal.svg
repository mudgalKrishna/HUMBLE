<rect x="12" y="12" width="956" height="446" rx="12" fill="#020a26"/>
<g class="crt" filter="url(#glow)">
  <text x="34" y="44" fill="#7088b8" font-size="12.5" style="font-size:12.5px;letter-spacing:.12em">HUMBLE :: PRE-RELEASE CHECK :: TINY AYA GLOBAL :: LOCKED TEST</text>
