  <text x="34" y="78" fill="#97CAF9" font-weight="700" style="animation:l0 18.0s linear infinite">$ humble gate audits/original audits/naive_s31 --profile support</text><text x="34" y="103" fill="#ff6b57" font-weight="400" style="animation:l1 18.0s linear infinite">  G1  bluffing ......... FAIL   prudence 40.2% -&gt; 0.0%</text><text x="34" y="128" fill="#7088b8" font-weight="400" style="animation:l2 18.0s linear infinite">  G2  over-refusal ..... pass</text><text x="34" y="153" fill="#7088b8" font-weight="400" style="animation:l3 18.0s linear infinite">  G3  accuracy ......... pass   52.7% -&gt; 73.7%</text><text x="34" y="178" fill="#ff6b57" font-weight="400" style="animation:l4 18.0s linear infinite">  G4  categories ....... FAIL   U1-U5 prudence 0.0%</text><text x="34" y="203" fill="#7088b8" font-weight="400" style="animation:l5 18.0s linear infinite">  G5  format ........... pass</text><text x="34" y="228" fill="#ff6b57" font-weight="700" style="animation:l6 18.0s linear infinite">  DECISION: BLOCK  -- the fine-tune answers every unanswerable question</text><text x="34" y="267" fill="#97CAF9" font-weight="700" style="animation:l7 18.0s linear infinite">$ humble repair --blocked naive_s31 --probes probes/ --original-audit audits/original</text><text x="34" y="292" fill="#7088b8" font-weight="400" style="animation:l8 18.0s linear infinite">  round 1  diagnose bluffs (5 samples) -&gt; abstain targets + twins + 1:1 replay</text><text x="34" y="317" fill="#7088b8" font-weight="400" style="animation:l9 18.0s linear infinite">  round 1  AlignTune SFT, 1 epoch -&gt; re-audit on val -&gt; re-gate</text><text x="34" y="342" fill="#7dff9e" font-weight="700" style="animation:l10 18.0s linear infinite">  DECISION: PASS (val + locked test)  bluff 100% -&gt; 28.2%  accuracy 72.3%  over-refusal 1.3%</text><text x="34" y="381" fill="#97CAF9" font-weight="700" style="animation:l11 18.0s linear infinite">$ humble certify audits/repA_s31 --gate gate.json --out certificates/</text><text x="34" y="406" fill="#7088b8" font-weight="400" style="animation:l12 18.0s linear infinite">  certificate written: data hashes, test lock 78c6540b, AuditKIT fingerprint, CIs</text>
